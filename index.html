<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>autopost — вход VK</title>
</head>
<body>
<p>Вход выполнен, окно можно закрыть, если оно не закроется само...</p>
<script>
  // VK редиректит сюда либо с ?code=...&state=... (или ?error=...) в query,
  // либо (implicit-флоу) с #access_token=...&state=... в hash-части URL —
  // hash браузер никуда, кроме этой страницы, не отправляет, поэтому здесь
  // переносим его в query для локального сервера программы autopost.
  // Сама страница эти параметры не хранит и никуда не отправляет.
  var hash = window.location.hash.replace(/^#/, "");
  var search = window.location.search.replace(/^\?/, "");
  var combined = [hash, search].filter(Boolean).join("&");
  var target = "http://127.0.0.1:53682/callback" + (combined ? "?" + combined : "");
  window.location.replace(target);
</script>
</body>
</html>
